<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#e7e9ee;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;cursor:none}
  iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0;opacity:0;transition:opacity .4s}
  iframe.on{opacity:1}
  #idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  #idle .n{font-size:6vh;letter-spacing:.05em} #idle .s{font-size:2.6vh;color:#8a93a6}
</style></head>
<body>
<div id="idle"><div class="n" id="who">Screen</div><div class="s" id="name"></div></div>
<iframe id="f" sandbox="allow-scripts allow-same-origin" allow="autoplay; fullscreen"></iframe>
<script>
// The receiver: poll what is on this screen; when it changes, load that cast page. The cast page itself polls its
// own state file (<page>.js, loaded relative to itself, so the key rides in the path) for video / gallery control.
const parts = location.pathname.split("/").filter(Boolean), NAME = decodeURIComponent(parts[1] || "");
const K = new URLSearchParams(location.search).get("k") || "";
const base = "/screen/" + encodeURIComponent(NAME), q = "?k=" + encodeURIComponent(K);
document.getElementById("name").textContent = NAME;
let cur = null;
async function tick() {
  try {
    const r = await fetch(base + "/now" + q, { cache: "no-store" });
    if (r.ok) {
      const d = await r.json(); document.getElementById("who").textContent = d.agent || "Screen";
      if (d.page !== cur) {
        cur = d.page; const f = document.getElementById("f");
        if (cur) { f.src = base + "/k/" + encodeURIComponent(K) + "/f/" + cur + ".html"; f.classList.add("on"); }
        else { f.classList.remove("on"); f.removeAttribute("src"); }
      }
    }
  } catch (e) { /* the stage server restarting: keep showing what is there, try again */ }
  setTimeout(tick, 1000);
}
tick();
</script>
</body></html>
